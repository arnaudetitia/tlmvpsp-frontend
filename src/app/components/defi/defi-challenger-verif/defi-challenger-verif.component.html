<div class="defi-challenger-verif-container">
  <div class="champ theme">{{ recap.theme }}</div>

  <div class="champ question">
    {{ currentQuestion.question }}
  </div>

  @if (currentQuestion.propositions.length) {
    <mat-grid-list
      [cols]="2"
      rowHeight="12vh"
      gutterSize="2vh"
      >
      @for (reponse of currentQuestion.propositions; track reponse) {
        <mat-grid-tile>
          <champ-reponse
            [reponse]="reponse"
            [selected]="reponse === currentQuestion.reponseDonnee"
            [bonneReponseShown]="showBonneReponse"
            [reponseAlreadySelected]="true"
            [isBonneReponse]="currentQuestion.bonneReponse === reponse"
          ></champ-reponse>
        </mat-grid-tile>
      }
    </mat-grid-list>
  } @else {
    <div class="reponse-cash-container">
      <champ-reponse
        class="reponse-cash"
        [reponse]="showBonneReponse ? currentQuestion.bonneReponse : currentQuestion.reponseDonnee"
        [isBonneReponse]="showBonneReponse"
        [bonneReponseShown]="showBonneReponse"
      ></champ-reponse>
    </div>
  }

</div>
