<div
  class="champ reponse"
  [class.selected]="selected && !bonneReponseShown"
  [class.bonne-reponse]="isBonneReponse"
  [class.bonne-reponse-show]="bonneReponseShown"
  [class.selectionnable]="isSelectionnable"
  [class.proposition]="isProposition"
  [class]="{
    qualif: typeChamp === TypeChamp.QUALIF,
    compet: typeChamp === TypeChamp.COMPET,
    challenger: typeChamp === TypeChamp.CHALLENGER,
    champion: typeChamp === TypeChamp.CHAMPION,
  }"
  (click)="selectionReponse()"
>
  {{ reponse }}
</div>
